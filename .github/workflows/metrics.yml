name: Atualizar Estatísticas
on:
  # Atualiza todos os dias à meia-noite
  schedule: [{cron: "0 0 * * *"}]
  # Permite rodar manualmente clicando num botão
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: wesleyRocha-hash
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Sao_Paulo
          
          # Plugin de Linguagens
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_limit: 4
          
          # Estética Dark & Bronze
          config_padding: 6%
          base_indepth: yes
          config_theme: dark
          # Cores customizadas (Fundo preto, texto claro, ícones bronze)
          custom_title: "#cd7f32"
          custom_icon: "#cd7f32"
